name: Daily Royal History Generation & Publishing

on:
  schedule:
    # ১. প্রধান রান: প্রতিদিন রাত ১২:০৫ বাংলাদেশ সময় (18:05 UTC) — নতুন দিন শুরু হতেই রেডি
    - cron: '5 18 * * *'
    # ২. সেফটি চেক: প্রতিদিন ভোর ০৫:০০ বাংলাদেশ সময় (23:00 UTC) — সকাল ৬টার ১ ঘণ্টা আগে নিশ্চিতকরণ
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category: bangladesh, or world (empty for auto)'
        required: false
        default: ''
      theme:
        description: 'Theme key (e.g. archival-gold, independence-emerald, vintage-parchment)'
        required: false
        default: ''
      uid:
        description: 'Specific event UID (empty for auto)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Dhaka
      HISTORY_CATEGORY: ${{ github.event.inputs.category }}
      HISTORY_THEME: ${{ github.event.inputs.theme }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Daily Royal History Card (1080x1080 PNG)
        run: |
          CMD="node scripts/generate-history.js"
          if [ -n "${{ github.event.inputs.uid }}" ]; then
            CMD="$CMD --uid=${{ github.event.inputs.uid }}"
          fi
          $CMD

      - name: Commit & Push Daily Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ database/
          if git diff --cached --quiet; then
            echo "No changes to commit (already up to date)."
          else
            git commit -m "chore(daily): publish today's history card $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
